[package]
name = "trybase-daemon"
version = "0.1.0"
edition = "2021"
authors = ["TryBase Core Team <security@trybase.io>"]
description = "Kernel-enforced anti-leak secret daemon for TryBase MicroVMs"

[[bin]]
name = "trybase-daemon"
path = "src/main.rs"

[[bin]]
name = "trybase-entrypoint"
path = "src/bin/entrypoint.rs"

[dependencies]
tokio = { version = "1.43", features = ["full", "net", "io-util", "signal", "process"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
nix = { version = "0.29", features = ["socket", "uio", "user", "process"] }
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
